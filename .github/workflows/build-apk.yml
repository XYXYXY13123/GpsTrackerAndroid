# Baut bei jedem Hochladen automatisch die APK und stellt sie unter "Releases" zum Download bereit.
name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk TachoAnsage.apk

      - name: APK als Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: TachoAnsage-apk
          path: TachoAnsage.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tacho Ansage Build ${{ github.run_number }}
          files: TachoAnsage.apk
